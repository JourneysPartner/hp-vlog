[build]
  command = "npm install && npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Netlify Scheduled Functions ────────────────────────────────────────
# GitHub Actions の schedule は数時間遅延するため、Netlify 側で時刻トリガーを管理する。
# 各関数は GitHub Actions の workflow_dispatch を叩いて起動する。

# 毎日 JST 09:05 に daily-draft を起動 → Chatwork 記事確認通知（9時台）
[functions."scheduler-daily-draft"]
  schedule = "5 0 * * *"

# 毎日 JST 11:05 に publish-scheduled を起動 → 予約記事の自動公開（11時台）
[functions."scheduler-publish"]
  schedule = "5 2 * * *"

# ── Redirects / Rewrites ──────────────────────────────────────────────

# レビュー画面: /review?file=xxx.md → Netlify Function
[[redirects]]
  from = "/review"
  to = "/.netlify/functions/review-page"
  status = 200

# ブログ記事URL: Netlify の Pretty URLs が自動的に
# /blog/slug → /blog/slug/ → blog/slug/index.html を解決するため
# 手動の 301 redirect は不要（設定すると redirect loop の原因になる）

# 404 — 静的ファイルが存在しないパスのみ発動
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
