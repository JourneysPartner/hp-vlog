[build]
  command = "npm install && npm run build"
  publish = "."
  functions = "netlify/functions"
  # 下書きの試しビルド・表示に影響しない変更を飛ばす。元に戻すには次の1行を消す。
  ignore = "node scripts/netlify-ignore-build.js"

[build.environment]
  NODE_VERSION = "20"

# 管理画面の関数からサーチコンソールの週次レポート（data/search-console/report.md）を読めるようにする
[functions]
  included_files = ["data/search-console/**"]

# シミュレーターだけを既存の記事・管理画面から分離した厳格な送信先制限。
[[headers]]
  for = "/tools/*"
  [headers.values]
    Cache-Control = "max-age=300, must-revalidate"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; frame-ancestors 'none'; worker-src 'none'; manifest-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), web-share=(), xr-spatial-tracking=()"

[[headers]]
  for = "/assets/js/tax-simulator.*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ハッシュ無しのCSS/JSは長くしすぎない（更新が反映されなくなる）。画像は1週間。
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/main.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── Netlify Scheduled Functions ────────────────────────────────────────
# GitHub Actions の schedule は数時間遅延するため、Netlify 側で時刻トリガーを管理する。
# 各関数は GitHub Actions の workflow_dispatch を叩いて起動する。

# 毎日 JST 09:05 に daily-draft を起動 → Chatwork 記事確認通知（9時台）
[functions."scheduler-daily-draft"]
  schedule = "5 0 * * *"

# 毎日 JST 12:00 に publish-scheduled を起動 → 予約記事の自動公開（morning 枠）
# 旧 11:05 起動から後ろ倒し。publish_at は 11:05〜11:55 のジッタが入るため、
# 窓の末尾 (11:55) より後ろの 12:00 に起動して publish-due.js が全件拾えるようにする。
[functions."scheduler-publish"]
  schedule = "0 3 * * *"

# 毎日 JST 18:00 に publish-scheduled を起動 → 予約記事の自動公開（evening 枠）
# 旧 17:05 起動から後ろ倒し（同様に publish_at 17:05〜17:55 のジッタを拾う）。
[functions."scheduler-publish-evening"]
  schedule = "0 9 * * *"

# 毎日 JST 03:00 にアクセス解析の短期マーカーを削除
[functions."analytics-cleanup"]
  schedule = "0 18 * * *"

# ── Redirects / Rewrites ──────────────────────────────────────────────

# 管理画面の入口: 認証後に /admin/articles へリダイレクト
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin-home"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/.netlify/functions/admin-home"
  status = 200

# レビュー画面: /review?file=xxx.md → Netlify Function
[[redirects]]
  from = "/review"
  to = "/.netlify/functions/review-page"
  status = 200

# 管理画面: /admin/articles → Netlify Function（HTTP Basic 認証必須）
[[redirects]]
  from = "/admin/articles"
  to = "/.netlify/functions/admin-articles-page"
  status = 200

# 管理API: 記事一覧取得（HTTP Basic 認証必須）
[[redirects]]
  from = "/admin/api/list"
  to = "/.netlify/functions/admin-list-articles"
  status = 200

# 管理API: 状態変更（unpublish / cancel_publish。HTTP Basic 認証必須）
[[redirects]]
  from = "/admin/api/change"
  to = "/.netlify/functions/admin-change-article-status"
  status = 200

# 管理画面: /admin/candidates → 質疑応答事例候補管理（HTTP Basic 認証必須）
[[redirects]]
  from = "/admin/candidates"
  to = "/.netlify/functions/admin-candidates-page"
  status = 200

# 管理API: 候補リスト取得（HTTP Basic 認証必須）
[[redirects]]
  from = "/admin/api/candidates/list"
  to = "/.netlify/functions/admin-list-candidates"
  status = 200

# 管理API: 候補の採用フラグ保存（HTTP Basic 認証必須）
[[redirects]]
  from = "/admin/api/candidates/save"
  to = "/.netlify/functions/admin-save-candidates"
  status = 200

# アクセス解析: 公開ビーコンと Basic 認証付き管理画面/API
[[redirects]]
  from = "/track"
  to = "/.netlify/functions/track-visit"
  status = 200

[[redirects]]
  from = "/admin/analytics"
  to = "/.netlify/functions/admin-analytics-page"
  status = 200

[[redirects]]
  from = "/admin/api/analytics"
  to = "/.netlify/functions/admin-list-analytics"
  status = 200

# ブログ記事URL: Netlify の Pretty URLs が自動的に
# /blog/slug → /blog/slug/ → blog/slug/index.html を解決するため
# 手動の 301 redirect は不要（設定すると redirect loop の原因になる）

# 404 — 静的ファイルが存在しないパスのみ発動
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
