[build]
  command = "npm install && npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# レビュー画面: /review?file=xxx.md → Netlify Function
[[redirects]]
  from = "/review"
  to = "/.netlify/functions/review-page"
  status = 200

# ブログ記事URL: /blog/slug/ → blog/slug/index.html
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/"
  status = 301

# 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
