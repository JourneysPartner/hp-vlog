[build]
  command = "npm install && npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# レビュー画面: /review?file=xxx.md → Netlify Function
[[redirects]]
  from = "/review"
  to = "/.netlify/functions/review-page"
  status = 200

# ブログ記事URL: Netlify の Pretty URLs が自動的に
# /blog/slug → /blog/slug/ → blog/slug/index.html を解決するため
# 手動の 301 redirect は不要（設定すると redirect loop の原因になる）

# 404 — 静的ファイルが存在しないパスのみ発動
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
