<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="税務シミュレーターの訂正内容と再計算案内を掲載する履歴ページです。">
  <link rel="canonical" href="https://mori-zeirishi.net/tools/corrections/">
  <title>税務シミュレーター訂正履歴｜毛利順活税理士事務所</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/tax-simulator.css">
</head>
<body class="tax-simulator-page">
{{HEADER}}
<main>
  <section class="simulator-intro">
    <div class="simulator-page-container">
      <nav class="simulator-breadcrumb" aria-label="パンくずリスト"><a href="/">ホーム</a><span aria-hidden="true">›</span>訂正履歴</nav>
      <h1>税務シミュレーター訂正履歴</h1>
      <p class="simulator-lead">計算内容に訂正が生じた場合、その影響範囲と再計算の要否をここでお知らせします。</p>
    </div>
  </section>
  <section class="simulator-static-info">
    <div class="simulator-page-container">
      <article class="simulator-info-card">
        <h2>現在の訂正状況</h2>
        <p>現在、訂正はありません。</p>
      </article>
      <article class="simulator-info-card">
        <h2>訂正履歴の記載項目</h2>
        <p>訂正がある場合は、次の項目を記載します。</p>
        <ul>
          <li>訂正日</li><li>影響した計算バージョン</li><li>マスタースナップショットID</li><li>影響期間</li><li>再計算の要否</li>
        </ul>
        <p>過去の計算結果への影響がある場合は、対象となる方への再計算案内も掲載します。</p>
      </article>
    </div>
  </section>
</main>
{{FOOTER}}
</body>
</html>
