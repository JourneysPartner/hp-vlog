<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <link rel="canonical" href="https://mori-zeirishi.net{{CANONICAL_URL}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/blog.css">
</head>
<body>

{{HEADER}}

<!-- ========== PAGE HERO ========== -->
<section class="page-hero">
  <div class="container text-center" data-aos="fade-up">
    <span class="section-label">{{SECTION_LABEL}}</span>
    <h1 class="page-hero-title">{{PAGE_HEADING}}</h1>
    <p class="page-hero-lead">{{PAGE_LEAD}}</p>
  </div>
</section>

<!-- ========== MACRO PILLS ========== -->
<section class="blog-pills-wrap">
  <div class="container">
    {{PILLS_HTML}}
  </div>
</section>

<!-- ========== BLOG LIST + SIDEBAR ========== -->
<section class="section-py bg-gray">
  <div class="container">
    <div class="blog-layout">
      <div class="blog-main">
        {{POSTS_HTML}}
        {{PAGINATION_HTML}}
      </div>
      {{SIDEBAR_HTML}}
    </div>
  </div>
</section>

<!-- ========== CTA ========== -->
<section class="cta-section">
  <div class="container position-relative" style="z-index:1;">
    <div data-aos="fade-up">
      <h2>税務のお悩み、お気軽にご相談ください</h2>
      <p>初回相談は無料です。記事の内容についてのご質問もお受けします。</p>
      <a href="/contact.html" class="btn-outline-custom"><i class="bi bi-envelope"></i>無料相談・お問い合わせ</a>
    </div>
  </div>
</section>

{{FOOTER}}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
