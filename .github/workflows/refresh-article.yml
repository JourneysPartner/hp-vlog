name: 記事の更新案
run-name: 記事の更新案 ${{ inputs.slug }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 更新する記事の slug
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存関係を準備
        run: npm install

      - name: 候補と公開状態を確認
        id: candidate
        env:
          SLUG: ${{ inputs.slug }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/lib/freshness-workflow.js prepare

      - name: 対象外を通知
        if: steps.candidate.outputs.valid != 'true'
        env:
          TITLE: ${{ inputs.slug }}
          REASON: ${{ steps.candidate.outputs.reason }}
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: node scripts/notify.js --event refresh_failed --title "$TITLE" --comment "$REASON"

      - name: 作業枝を準備
        id: branch
        if: steps.candidate.outputs.valid == 'true'
        env:
          SLUG: ${{ inputs.slug }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="draft/refresh-$SLUG"
          OPEN_URL=$(gh pr list --state open --head "$BRANCH" --limit 100 --json url --jq '.[0].url // ""')
          if [ -n "$OPEN_URL" ]; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "pr_url=$OPEN_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH"
          fi
          git checkout -b "$BRANCH"
          echo "existing=false" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: 作成済みの更新案を通知
        if: steps.branch.outputs.existing == 'true'
        env:
          TITLE: ${{ steps.candidate.outputs.title }}
          REVIEW_URL: https://mori-zeirishi.net/review?file=${{ steps.candidate.outputs.filename }}&ref=draft/refresh-${{ inputs.slug }}
          PR_URL: ${{ steps.branch.outputs.pr_url }}
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: node scripts/notify.js --event refresh_ready --title "$TITLE" --review-url "$REVIEW_URL" --pr-url "$PR_URL" --comment "この更新案は作成済みです。"

      - name: 更新案を作成
        id: refresh
        if: steps.candidate.outputs.valid == 'true' && steps.branch.outputs.existing != 'true'
        env:
          FILE: ${{ steps.candidate.outputs.filename }}
          REASONS_FILE: ${{ steps.candidate.outputs.reasons_file }}
          RUNNER_TEMP: ${{ runner.temp }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_MODEL_PROVIDER: ${{ vars.CONTENT_MODEL_PROVIDER }}
          CONTENT_MODEL: ${{ vars.CONTENT_MODEL }}
          FACT_CHECK_PROVIDER: ${{ vars.FACT_CHECK_PROVIDER }}
          FACT_CHECK_MODEL: ${{ vars.FACT_CHECK_MODEL }}
          FACT_CHECK_ENABLED: ${{ vars.FACT_CHECK_ENABLED }}
          FACT_CHECK_FAIL_OPEN: ${{ vars.FACT_CHECK_FAIL_OPEN }}
          FACT_CHECK_MAX_CLAIMS: ${{ vars.FACT_CHECK_MAX_CLAIMS }}
          SOURCE_BODY_MAX_CHARS_PER_PAGE: ${{ vars.SOURCE_BODY_MAX_CHARS_PER_PAGE }}
          SOURCE_BODY_MAX_CHARS_TOTAL: ${{ vars.SOURCE_BODY_MAX_CHARS_TOTAL }}
          LAW_CHAIN_MAX_ARTICLES: ${{ vars.LAW_CHAIN_MAX_ARTICLES }}
          LAW_CHAIN_MAX_CHARS: ${{ vars.LAW_CHAIN_MAX_CHARS }}
          GENERIC_SOURCE_MIN_POSTS: ${{ vars.GENERIC_SOURCE_MIN_POSTS }}
          CONTENT_MODEL_USE_PROMPT_CACHE: ${{ vars.CONTENT_MODEL_USE_PROMPT_CACHE || secrets.CONTENT_MODEL_USE_PROMPT_CACHE }}
          AUX_MODEL_ENABLED: ${{ vars.AUX_MODEL_ENABLED }}
          AUX_MODEL_PROVIDER: ${{ vars.AUX_MODEL_PROVIDER }}
          AUX_MODEL: ${{ vars.AUX_MODEL }}
          ENABLE_PARTIAL_REVISE: ${{ vars.ENABLE_PARTIAL_REVISE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/generate-draft.js --refresh --filename "$FILE" --reasons-file "$REASONS_FILE"

      - name: AIによる変更なしを通知
        if: steps.refresh.outputs.refresh_result == 'no_change'
        env:
          TITLE: ${{ steps.candidate.outputs.title }}
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: node scripts/notify.js --event refresh_no_change --title "$TITLE"

      - name: 更新案を作れなかった理由を通知
        if: steps.refresh.outputs.refresh_result == 'failed'
        env:
          TITLE: ${{ steps.candidate.outputs.title }}
          REASON: ${{ steps.refresh.outputs.refresh_reason }}
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: node scripts/notify.js --event refresh_failed --title "$TITLE" --comment "$REASON"

      - name: 対象記事を検証
        if: steps.refresh.outputs.refresh_result == 'changed'
        env:
          FILE: ${{ steps.candidate.outputs.filename }}
        run: node scripts/validate.js "content/posts/$FILE"

      - name: PR本文を作成
        if: steps.refresh.outputs.refresh_result == 'changed'
        env:
          REASONS_FILE: ${{ steps.candidate.outputs.reasons_file }}
          DIFF_FILE: ${{ steps.refresh.outputs.refresh_diff_file }}
          EXPIRED_THEME: ${{ steps.candidate.outputs.expired_theme }}
          REVIEW_URL: https://mori-zeirishi.net/review?file=${{ steps.candidate.outputs.filename }}&ref=${{ steps.branch.outputs.branch }}
          BODY_FILE: ${{ runner.temp }}/refresh-pr-body.md
        run: node scripts/lib/freshness-workflow.js pr-body

      - name: 記事だけを commit して PR を作成
        id: pr
        if: steps.refresh.outputs.refresh_result == 'changed'
        env:
          FILE: ${{ steps.candidate.outputs.filename }}
          TITLE: ${{ steps.candidate.outputs.title }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BODY_FILE: ${{ runner.temp }}/refresh-pr-body.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "content/posts/$FILE"
          SLUG=$(node -e 'const fs=require("fs"),m=require("gray-matter"); console.log(m(fs.readFileSync(process.argv[1],"utf8")).data.slug)' "content/posts/$FILE")
          FACTFILE="data/fact-check/$SLUG.json"
          if [ -f "$FACTFILE" ]; then git add "$FACTFILE"; fi
          if git diff --cached --quiet; then
            echo "::error::更新案に記事の変更がありません"
            exit 1
          fi
          STAGED=$(git diff --cached --name-only)
          while IFS= read -r STAGED_FILE; do
            if [ "$STAGED_FILE" != "content/posts/$FILE" ] && [ "$STAGED_FILE" != "$FACTFILE" ]; then
              echo "::error::記事・照合記録以外の変更がステージされています"
              exit 1
            fi
          done <<< "$STAGED"
          git commit -m "refresh: $FILE"
          git push origin "HEAD:$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "【更新】$TITLE（マージしない）" --body-file "$BODY_FILE")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: 更新案を通知
        if: steps.refresh.outputs.refresh_result == 'changed' && steps.pr.outputs.pr_url != ''
        env:
          TITLE: ${{ steps.candidate.outputs.title }}
          REASON: ${{ steps.candidate.outputs.reason }}
          FILE: ${{ steps.candidate.outputs.filename }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: |
          REVIEW_URL="https://mori-zeirishi.net/review?file=$FILE&ref=$BRANCH"
          node scripts/notify.js --event refresh_ready --title "$TITLE" --comment "$REASON" --review-url "$REVIEW_URL" --pr-url "$PR_URL"

      - name: 予期しない失敗を通知
        if: failure() && steps.candidate.outputs.valid == 'true' && steps.refresh.outputs.refresh_result != 'failed'
        env:
          TITLE: ${{ steps.candidate.outputs.title }}
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: node scripts/notify.js --event refresh_failed --title "$TITLE" --comment "更新案の作成処理に失敗しました。GitHub Actions のログを確認してください。"
