name: Regenerate Draft

on:
  workflow_dispatch:
    inputs:
      filename:
        description: '再生成する記事ファイル名 (例: 2026-04-07-xxx.md)'
        required: true
        type: string
      branch:
        description: '対象ブランチ (例: draft/blog-2026-04-07-3)'
        required: true
        type: string
      comment:
        description: '差し戻しコメント'
        required: true
        type: string

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0   # main を fetch するために履歴必要

      # ドラフトブランチは記事生成時点の scripts/ を抱えているため、
      # 後から main に入った修正（例: revision-classifier の改善）が
      # 反映されないという問題があった。
      # → ドラフトブランチの記事ファイルは保ちつつ、scripts/ と
      #    package*.json だけ main の最新で上書きしてから実行する。
      #    これらは後段の `git add content/posts/...` でコミット対象外。
      #    禁止フレーズ/denylist は review-revise が main 側へ追記するため、
      #    再生成でも main の最新を参照する（本文サニタイズ・タイトル禁止語ガードが
      #    今回追加した語を確実に見られるようにする）。
      - name: Use latest scripts, deps and moderation data from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/ package.json package-lock.json \
            data/banned-phrases.json data/topic-denylist.json
          echo "── 上書き済 scripts/ の HEAD: $(git rev-parse origin/main) ──"
          echo "── banned-phrases 件数: $(node -e "console.log((require('./data/banned-phrases.json').phrases||[]).length)") ──"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Regenerate draft
        id: regen
        run: |
          node scripts/generate-draft.js \
            --regenerate \
            --filename "${{ inputs.filename }}" \
            --comment "${{ inputs.comment }}"
        env:
          # 本文/部分再生成: Claude Sonnet 4.6（anthropic）。失敗時は OpenAI(gpt-5.4) に fallback。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_MODEL_PROVIDER: ${{ vars.CONTENT_MODEL_PROVIDER }}
          CONTENT_MODEL: ${{ vars.CONTENT_MODEL }}
          CONTENT_MODEL_USE_PROMPT_CACHE: ${{ vars.CONTENT_MODEL_USE_PROMPT_CACHE || secrets.CONTENT_MODEL_USE_PROMPT_CACHE }}
          # 周辺作業（分類補助・タイトル自然化等）: Haiku 4.5 またはルールベース
          AUX_MODEL_ENABLED: ${{ vars.AUX_MODEL_ENABLED }}
          AUX_MODEL_PROVIDER: ${{ vars.AUX_MODEL_PROVIDER }}
          AUX_MODEL: ${{ vars.AUX_MODEL }}
          # 部分再生成の有効/無効
          ENABLE_PARTIAL_REVISE: ${{ vars.ENABLE_PARTIAL_REVISE }}
          # OpenAI（fallback 用。必ず OPENAI_MODEL=gpt-5.4 を使う）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

      - name: Validate
        run: npm run validate

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 記事ファイルのみステージ。scripts/ など main から上書きしたものは
          # ドラフトブランチへコミットしない（毎回 main 同期で十分なため）。
          git add "content/posts/${{ inputs.filename }}"
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "regenerate: 差し戻し対応版を再生成 ${{ inputs.filename }}"
          git push origin "${{ inputs.branch }}"

      - name: Extract info for notification
        id: fm
        run: |
          FILE="content/posts/${{ inputs.filename }}"
          TITLE=$(grep '^title:' "$FILE" | head -1 | sed 's/^title: *"//;s/"$//')
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Notify via Netlify
        env:
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: |
          REVIEW_URL="https://mori-zeirishi.net/review?file=${{ inputs.filename }}&ref=${{ inputs.branch }}"
          node scripts/notify.js \
            --event regenerated \
            --title "${{ steps.fm.outputs.title }}" \
            --review-url "$REVIEW_URL" \
            --comment "${{ inputs.comment }}"
