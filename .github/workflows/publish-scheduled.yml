name: Publish Scheduled Articles

run-name: >-
  Publish Scheduled Articles [source=${{ inputs.trigger_source || 'manual' }}][jst=${{ inputs.scheduled_date_jst || 'none' }}]

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: '起動元 (manual / scheduler-publish)'
        required: false
        default: 'manual'
        type: string
      scheduled_date_jst:
        description: 'スケジューラが対象とする JST 日付 (YYYY-MM-DD)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# 同一日・同一枠に複数回 dispatch されても 1 つだけ走らせる（手動再実行と
# Netlify scheduler の二重起動による壊れを防ぐ最小限の保護）。
concurrency:
  group: publish-scheduled-${{ github.event.inputs.scheduled_date_jst || github.run_id }}-${{ github.event.inputs.trigger_source }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # NOTE: 旧 "Random delay (0-50 min)" ステップは GitHub Actions minutes を
      # 大量消費（月 ≈ 1,225 分）するため削除した（2026-06-25）。
      # 公開時刻のばらつきが将来必要なら、GitHub Actions の sleep ではなく
      # Netlify Functions 側（スケジューラ）または publish タイミングのアプリ側で
      # 再設計する前提とする。

      - name: Promote due articles to published
        id: promote
        run: node scripts/publish-due.js

      - name: Validate
        if: steps.promote.outputs.published_count != '0' && steps.promote.outputs.published_count != ''
        run: npm run validate

      - name: Build (smoke test)
        if: steps.promote.outputs.published_count != '0' && steps.promote.outputs.published_count != ''
        run: npm run build

      - name: Commit and push to main
        if: steps.promote.outputs.published_count != '0' && steps.promote.outputs.published_count != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          if git diff --cached --quiet; then
            echo "差分なし。スキップします。"
            exit 0
          fi
          COUNT="${{ steps.promote.outputs.published_count }}"
          git commit -m "publish: ${COUNT} 件の予約記事を公開"
          # 競合に備えて pull --rebase してから push
          git pull --rebase origin main || true
          git push origin main

      - name: Notify Chatwork (per article)
        if: steps.promote.outputs.published_count != '0' && steps.promote.outputs.published_count != ''
        env:
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
          SITE_BASE_URL: https://mori-zeirishi.net
        run: |
          IFS='|' read -r -a TITLES   <<< "${{ steps.promote.outputs.published_titles }}"
          IFS=','  read -r -a SLUGS    <<< "${{ steps.promote.outputs.published_slugs }}"
          IFS='|' read -r -a CATEGORIES <<< "${{ steps.promote.outputs.published_categories }}"
          IFS=','  read -r -a PERSONAS <<< "${{ steps.promote.outputs.published_personas }}"

          for i in "${!TITLES[@]}"; do
            TITLE="${TITLES[$i]}"
            SLUG="${SLUGS[$i]}"
            CATEGORY="${CATEGORIES[$i]}"
            PERSONA="${PERSONAS[$i]}"
            PUBLIC_URL="${SITE_BASE_URL}/blog/${SLUG}/"

            node scripts/notify.js \
              --event published \
              --title "$TITLE" \
              --category "$CATEGORY" \
              --persona "$PERSONA" \
              --public-url "$PUBLIC_URL"
          done
