name: Check Existing Posts

# 公開済み・承認済み記事の健全性を毎日検査する。
#
# 日次生成（daily-draft.yml）の検査は当日の生成物だけを対象にした。
# 2026-08-28/29 に、過去に承認済みの記事1件のメタ欠落で全件検査が ERROR になり、
# その日に生成できていた記事ごとジョブが落ちて2日連続で下書きが失われたため。
# 既存記事の検査はこちらで独立して行い、問題があれば通知する（生成は止めない）。

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 22:00 UTC = JST 07:00
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # gh run list で日次生成の実行状況を確認するため

concurrency:
  group: check-existing-posts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # 日次生成が「そもそも動かなかった」場合を拾う。
      # 失敗した場合は daily-draft.yml 側が通知するが、スケジューラが起動しない、
      # 起動したが記録が残らない、といったケースはそれでは検知できない。
      # 直近24時間に成功した生成があるかを朝の点検で確かめる。
      - name: Check daily draft ran
        id: draftrun
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh run list --workflow=daily-draft.yml --limit 10 \
            --json createdAt,conclusion \
            --jq "[.[] | select(.createdAt > \"$SINCE\") | select(.conclusion == \"success\")] | length")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo '::error::直近24時間に成功した記事生成がありません'
          else
            echo "直近24時間の成功した生成: ${COUNT} 件"
          fi

      - name: Notify if no draft was generated
        if: steps.draftrun.outputs.count == '0'
        env:
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/workflows/daily-draft.yml"
          node scripts/notify.js \
            --event daily_draft_failed \
            --title "$(TZ=Asia/Tokyo date +%Y-%m-%d) の記事生成" \
            --comment '直近24時間に成功した記事生成がありません（実行されていない可能性があります）。' \
            --pr-url "$RUN_URL" || echo '::warning::通知の送信に失敗しました'

      - name: Validate all posts
        id: validate
        run: |
          set +e
          npm run validate 2>&1 | tee /tmp/validate.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "0" ]; then
            echo "::error::既存記事に問題があります（日次生成は止まりません）"
            grep -E '\[ERROR\]|^content/posts/' /tmp/validate.log | head -40 || true
          fi
          exit 0

      - name: Notify on failure
        if: steps.validate.outputs.status != '0'
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          if [ -z "$CHATWORK_API_TOKEN" ] || [ -z "$CHATWORK_ROOM_ID" ]; then
            echo "::warning::通知設定が無いためスキップします"
            exit 0
          fi
          DETAIL=$(grep -E '\[ERROR\]|^content/posts/' /tmp/validate.log | head -20 || true)
          BODY=$(printf '[info][title]既存記事に問題があります[/title]公開済み・承認済みの記事に、記事バリデーションのエラーがあります。\n日次の記事生成は止まっていません。\n\n%s[/info]' "$DETAIL")
          curl -sS -X POST "https://api.chatwork.com/v2/rooms/${CHATWORK_ROOM_ID}/messages" \
            -H "X-ChatWorkToken: ${CHATWORK_API_TOKEN}" \
            --data-urlencode "body=${BODY}" > /dev/null && echo "通知しました"

      - name: Fail the job if something is wrong
        if: steps.validate.outputs.status != '0' || steps.draftrun.outputs.count == '0'
        run: exit 1
