name: Crawl NTA Sources

run-name: >-
  Crawl NTA Sources [mode=${{ github.event.inputs.mode || 'incremental' }}]

# 月次自動 + 手動実行（初回フル crawl 用）
#   - 自動：毎月 1 日 JST 00:00（UTC 15:00）に --incremental で実行
#   - 手動：workflow_dispatch で mode=full|incremental を選択可
#   - 変更があれば main へ自動 PR 化（main 直 push ではない、user 承認方針）
#   - Chatwork 通知（API キーが設定されていれば）
on:
  schedule:
    - cron: '0 15 1 * *'   # 毎月 1 日 JST 00:00（UTC 15:00）
  workflow_dispatch:
    inputs:
      mode:
        description: 'crawl モード（full: 全件 GET、incremental: HEAD で差分 skip）'
        required: false
        default: 'incremental'
        type: choice
        options:
          - 'incremental'
          - 'full'
          - 'backfill-figures'
      max_pages:
        description: '処理件数の上限（backfill-figures を分割実行したいときに指定。空なら全件）'
        required: false
        default: ''
        type: string
      max_deletions:
        description: '新しく削除済みにしてよい件数の上限（空なら 20）。上限で止まった後、人が確かめて上げるときに使う'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 2,000 ページ × 1 req/sec ≈ 35 分、余裕を持って 2 時間

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Determine crawl mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || 'incremental' }}
          INPUT_MAX_PAGES: ${{ github.event.inputs.max_pages }}
          INPUT_MAX_DELETIONS: ${{ github.event.inputs.max_deletions }}
        run: |
          MODE="${INPUT_MODE}"
          MAX="${INPUT_MAX_PAGES}"
          MAX_DELETIONS="${INPUT_MAX_DELETIONS}"
          if [[ "$MODE" != "incremental" && "$MODE" != "full" && "$MODE" != "backfill-figures" ]]; then
            echo "::error::mode は incremental、full、backfill-figures のいずれかで指定してください。"
            exit 1
          fi
          if [ -n "$MAX" ] && [[ ! "$MAX" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_pages は空、または1以上の整数で指定してください。"
            exit 1
          fi
          if [ -n "$MAX_DELETIONS" ] && [[ ! "$MAX_DELETIONS" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::max_deletions は空、または0以上の整数で指定してください。"
            exit 1
          fi
          LIMIT=''
          [ -n "$MAX" ] && LIMIT="--max-pages $MAX"
          DELETION_LIMIT=''
          [ -n "$MAX_DELETIONS" ] && DELETION_LIMIT="--max-deletions $MAX_DELETIONS"
          if [ "$MODE" = "full" ]; then
            ARGS="$LIMIT"
          elif [ "$MODE" = "backfill-figures" ]; then
            # 図（画像）の取り込みを既存レコードへ後追いで入れるモード。
            # 通常の incremental は html_hash が変わらないページを HEAD で
            # スキップするため、これを使わないと既存レコードに図が付かない。
            ARGS="--backfill-figures $LIMIT"
          else
            ARGS="--incremental $LIMIT"
          fi
          # 削除の上限は incremental・full のときだけ渡す（backfill-figures は削除判定をしない）。
          if [ -n "$DELETION_LIMIT" ] && [ "$MODE" != "backfill-figures" ]; then
            if [ -n "$ARGS" ] && [ "${ARGS: -1}" != " " ]; then
              ARGS="$ARGS "
            fi
            ARGS="$ARGS$DELETION_LIMIT"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Run crawl
        id: crawl
        env:
          CRAWL_ARGS: ${{ steps.mode.outputs.args }}
        run: |
          set -o pipefail
          # Determine crawl mode で R2 の形式確認を済ませた値を、従来どおり空白で分けて渡す。
          # 報告ファイルは PR 本文に貼る（--skip-index でも書かれる）。
          REPORT_ARGS=()
          if [ -n "${RUNNER_TEMP:-}" ]; then
            REPORT_ARGS=(--report-file "$RUNNER_TEMP/nta-crawl-report.md"
              --report-full-file "$RUNNER_TEMP/nta-crawl-report-full.md")
          fi
          node scripts/crawl-nta-sources.js $CRAWL_ARGS "${REPORT_ARGS[@]}" 2>&1 | tee /tmp/crawl.log
          echo "log_tail<<EOF" >> "$GITHUB_OUTPUT"
          tail -50 /tmp/crawl.log >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Read meta.json
        id: meta
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ -f data/nta-sources/meta.json ]; then
            FETCHED=$(jq -r '.crawl_results.fetched // 0' data/nta-sources/meta.json)
            SKIPPED=$(jq -r '.crawl_results.skipped // 0' data/nta-sources/meta.json)
            DELETED=$(jq -r '.crawl_results.deleted // 0' data/nta-sources/meta.json)
            DELETED_STILL=$(jq -r '.crawl_results.deleted_still // 0' data/nta-sources/meta.json)
            DELETION_HELD=$(jq -r '.crawl_results.deletion_held // 0' data/nta-sources/meta.json)
            RESTORED=$(jq -r '.crawl_results.restored // 0' data/nta-sources/meta.json)
            GONE_UNRECORDED=$(jq -r '.crawl_results.gone_unrecorded // 0' data/nta-sources/meta.json)
            UNLISTED=$(jq -r '.crawl_results.unlisted // 0' data/nta-sources/meta.json)
            UNLISTED_CHECK=$(jq -r '.unlisted_check // ""' data/nta-sources/meta.json)
            UNLISTED_CATEGORY_UNLISTED=$(jq -r '[.unlisted_entries[]? | select(.outcome == "category_unlisted")] | length' data/nta-sources/meta.json)
            ERRORS=$(jq -r '.crawl_results.errors_count // 0' data/nta-sources/meta.json)
            TOTAL=$(jq -r '.total_entries_processed // 0' data/nta-sources/meta.json)
            DURATION=$(jq -r '.last_crawl_duration_seconds // 0' data/nta-sources/meta.json)
          else
            FETCHED=0; SKIPPED=0; DELETED=0; DELETED_STILL=0; DELETION_HELD=0
            RESTORED=0; GONE_UNRECORDED=0; UNLISTED=0; UNLISTED_CHECK=''; ERRORS=0; TOTAL=0; DURATION=0
            UNLISTED_CATEGORY_UNLISTED=0
          fi
          # backfill-figures は meta.json を書かないので、前回の取り込みの削除の数が
          # 残っている。古い「上限で止めた」警告を出さないよう 0 にする。
          if [ "$MODE" = "backfill-figures" ]; then
            DELETED=0; DELETED_STILL=0; DELETION_HELD=0; RESTORED=0; GONE_UNRECORDED=0
            UNLISTED=0; UNLISTED_CHECK=''; UNLISTED_CATEGORY_UNLISTED=0
          fi
          # error_rate（％、小数1桁）
          if [ "$TOTAL" -gt 0 ]; then
            ERROR_RATE=$(awk "BEGIN { printf \"%.1f\", ($ERRORS * 100.0) / $TOTAL }")
          else
            ERROR_RATE="0.0"
          fi
          {
            echo "fetched=$FETCHED"
            echo "skipped=$SKIPPED"
            echo "deleted=$DELETED"
            echo "deleted_still=$DELETED_STILL"
            echo "deletion_held=$DELETION_HELD"
            echo "restored=$RESTORED"
            echo "gone_unrecorded=$GONE_UNRECORDED"
            echo "unlisted=$UNLISTED"
            echo "unlisted_check=$UNLISTED_CHECK"
            echo "unlisted_category_unlisted=$UNLISTED_CATEGORY_UNLISTED"
            echo "errors=$ERRORS"
            echo "total=$TOTAL"
            echo "duration=$DURATION"
            echo "error_rate=$ERROR_RATE"
          } >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/has-substantive-change.js data/nta-sources >> "$GITHUB_OUTPUT"

      - name: Create PR if changes
        id: pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCHED: ${{ steps.meta.outputs.fetched }}
          SKIPPED: ${{ steps.meta.outputs.skipped }}
          DELETED: ${{ steps.meta.outputs.deleted }}
          DELETED_STILL: ${{ steps.meta.outputs.deleted_still }}
          DELETION_HELD: ${{ steps.meta.outputs.deletion_held }}
          RESTORED: ${{ steps.meta.outputs.restored }}
          GONE_UNRECORDED: ${{ steps.meta.outputs.gone_unrecorded }}
          UNLISTED: ${{ steps.meta.outputs.unlisted }}
          UNLISTED_CHECK: ${{ steps.meta.outputs.unlisted_check }}
          ERRORS: ${{ steps.meta.outputs.errors }}
          TOTAL: ${{ steps.meta.outputs.total }}
          DURATION: ${{ steps.meta.outputs.duration }}s
          ERROR_RATE: ${{ steps.meta.outputs.error_rate }}
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # ブランチ名に run_id を付ける。日付だけだと同じ日に 2 回走らせたとき
          # 既存ブランチと衝突して push が non-fast-forward で失敗し、その回の
          # 取り込み結果がまるごと失われる（2026-09-06 の backfill 2回目で発生）。
          # backfill-figures は分割実行が前提なので、同日複数回を許す必要がある。
          BRANCH="chore/nta-crawl-${DATE}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add data/nta-sources/

          COMMIT_MSG=$(cat <<COMMITEOF
          chore(nta): 国税庁ソース DB 月次更新 (${DATE})

          mode: ${MODE}
          fetched: ${FETCHED}
          skipped: ${SKIPPED}
          deleted: ${DELETED}
          errors:  ${ERRORS}
          duration: ${DURATION}
          COMMITEOF
          )
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"

          # 一覧から外れた記録の行は、確かめたときだけ数を出す（H3）。
          if [ "$UNLISTED_CHECK" = "done" ]; then
            UNLISTED_CELL="${UNLISTED}"
          elif [ "$UNLISTED_CHECK" = "skipped_too_many" ]; then
            UNLISTED_CELL="多すぎるため確かめていない（${UNLISTED} 件）"
          else
            UNLISTED_CELL="確かめていない"
          fi

          cat > "$RUNNER_TEMP/pr-body.md" <<PRBODYEOF
          ## 概要
          国税庁ソース DB の月次自動更新です（mode: ${MODE}）。

          | 項目 | 件数 |
          |---|---|
          | fetched | ${FETCHED} |
          | skipped | ${SKIPPED} |
          | 新しく削除済み | ${DELETED} |
          | 前から削除済み | ${DELETED_STILL} |
          | 上限で止めた | ${DELETION_HELD} |
          | 戻った | ${RESTORED} |
          | 一覧にはあるがページが無い | ${GONE_UNRECORDED} |
          | 国税庁の一覧から外れた記録 | ${UNLISTED_CELL} |
          | errors | ${ERRORS} |
          | total processed | ${TOTAL} |
          | duration | ${DURATION} |
          | error rate | ${ERROR_RATE}% |

          ## 確認ポイント
          - **新しく削除済みにした資料があれば**：下の一覧で国税庁のページが本当に無いことを確かめてからマージする
          - **上限で止めたものがあれば**：確かめてから、この PR は閉じてから max_deletions を上げて手動で実行し直す
          - **一覧から外れた記録があれば**：下の節で結果を見る。「ページはある」は国税庁が一覧から外した古いページの可能性がある
          - **大量の deleted があれば**：対象 URL の削除・移転が発生している可能性。国税庁サイトの構造変更を疑う
          - **error_rate が 5% 超なら**：crawl ロジックの問題か NTA サイト構造変更を疑う
          - **fetched が想定より多い**：通常の incremental では数件〜数十件が想定範囲

          ## レビュー観点
          - 内容に問題なければそのまま merge してください
          - 改正情報が反映された場合、関連記事の更新検討も
          PRBODYEOF
          # PR 本文の字数を確かめる（H6）。GitHub の上限 65,536 は字数で、
          # 日本語はバイトで数えると 3 倍になるため、`wc -m` で数える。
          # 報告をつないで 60,000 字を超えるなら、つながずに 1 文だけ足す
          # （`gh pr create` が失敗して取り込みの結果が失われないようにする）。
          REPORT_TOO_LONG=''
          if [ "$MODE" != "backfill-figures" ] && [ -f "$RUNNER_TEMP/nta-crawl-report.md" ]; then
            BODY_CHARS=$(LC_ALL=C.UTF-8 wc -m < "$RUNNER_TEMP/pr-body.md" | tr -d '[:space:]')
            REPORT_CHARS=$(LC_ALL=C.UTF-8 wc -m < "$RUNNER_TEMP/nta-crawl-report.md" | tr -d '[:space:]')
            if [ $((BODY_CHARS + REPORT_CHARS)) -gt 60000 ]; then
              REPORT_TOO_LONG=1
            fi
          fi
          if [ -n "$REPORT_TOO_LONG" ]; then
            {
              echo ""
              echo "報告が長すぎるため本文に載せていません。全件は Actions の実行の要約（${RUN_URL}）と meta.json にあります"
            } >> "$RUNNER_TEMP/pr-body.md"
          elif [ "$MODE" != "backfill-figures" ] && [ -f "$RUNNER_TEMP/nta-crawl-report.md" ]; then
            {
              echo ""
              cat "$RUNNER_TEMP/nta-crawl-report.md"
            } >> "$RUNNER_TEMP/pr-body.md"
          fi

          PR_URL=$(gh pr create \
            --title "chore(nta): 国税庁ソース DB 月次更新 (${DATE})" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --base main \
            --head "$BRANCH")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "::notice::PR を作成しました: $PR_URL"

      - name: Notify Chatwork
        if: always()
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
          UNLISTED_CHECK: ${{ steps.meta.outputs.unlisted_check }}
          UNLISTED_CATEGORY_UNLISTED: ${{ steps.meta.outputs.unlisted_category_unlisted }}
          MODE: ${{ steps.mode.outputs.mode }}
          FETCHED: ${{ steps.meta.outputs.fetched }}
          SKIPPED: ${{ steps.meta.outputs.skipped }}
          DELETED: ${{ steps.meta.outputs.deleted }}
          DELETION_HELD: ${{ steps.meta.outputs.deletion_held }}
          ERRORS: ${{ steps.meta.outputs.errors }}
          DURATION: ${{ steps.meta.outputs.duration }}
          ERROR_RATE: ${{ steps.meta.outputs.error_rate }}
          HAS_CHANGES: ${{ steps.changes.outputs.changed }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "${CHATWORK_API_TOKEN:-}" ] || [ -z "${CHATWORK_ROOM_ID:-}" ]; then
            echo "::notice::Chatwork 環境変数が未設定 → 通知スキップ"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_MARK="✓ 成功"
          else
            STATUS_MARK="✗ 失敗（job.status=$JOB_STATUS）"
          fi
          if [ "$HAS_CHANGES" = "true" ]; then
            CHANGE_LINE="■ 変更あり → PR: ${PR_URL}"
          else
            CHANGE_LINE="■ 変更なし（時刻のみ更新のため PR は作成しません）"
          fi
          # エラー率と削除件数の警告
          WARN_LINE=""
          ERROR_RATE_INT=$(awk "BEGIN { printf \"%d\", ${ERROR_RATE} }")
          if [ "$ERROR_RATE_INT" -ge 5 ]; then
            WARN_LINE="${WARN_LINE}
          ■ ⚠ error_rate 5%超：crawl ロジック または NTA サイト構造変更を疑う"
          fi
          if [ "$DELETED" -ge 10 ]; then
            WARN_LINE="${WARN_LINE}
          ■ ⚠ deleted 10件以上：大量の URL 削除/移転検知"
          fi
          if [ "$DELETION_HELD" -ge 1 ]; then
            WARN_LINE="${WARN_LINE}
          ■ ⚠ 削除の上限で ${DELETION_HELD} 件を止めました：確かめて max_deletions を上げて再実行してください（実行: ${RUN_URL}）"
          fi
          if [ "$UNLISTED_CHECK" = "skipped_too_many" ]; then
            WARN_LINE="${WARN_LINE}
          ■ ⚠ 一覧から外れた記録が多すぎるため確かめていません：一覧の取得の不具合を疑う（実行: ${RUN_URL}）"
          fi
          # 分類の一覧が 1 件も取れなかったときは、一覧の取得の不具合を疑う（H7）。
          if [ "${UNLISTED_CATEGORY_UNLISTED:-0}" -ge 1 ]; then
            WARN_LINE="${WARN_LINE}
          ■ ⚠ 国税庁の一覧で 1 件も取れなかった分類があります：一覧の取得の不具合を疑う（実行: ${RUN_URL}）"
          fi

          BODY=$(cat <<BODYEOF
          国税庁ソース DB 月次 crawl ${STATUS_MARK}
          mode: ${MODE}
          fetched: ${FETCHED} / skipped: ${SKIPPED} / deleted: ${DELETED} / errors: ${ERRORS} (${ERROR_RATE}%)
          duration: ${DURATION}s
          ${CHANGE_LINE}${WARN_LINE}
          BODYEOF
          )

          MSG_BODY="[info][title]NTA Source DB Crawl[/title]${BODY}[/info]"

          curl -sS -X POST \
            -H "X-ChatWorkToken: ${CHATWORK_API_TOKEN}" \
            --data-urlencode "body=${MSG_BODY}" \
            "https://api.chatwork.com/v2/rooms/${CHATWORK_ROOM_ID}/messages" \
            | head -c 500
          echo ""

      - name: Emit job summary
        if: always()
        env:
          MODE_MODE: ${{ steps.mode.outputs.mode }}
          META_FETCHED: ${{ steps.meta.outputs.fetched }}
          META_SKIPPED: ${{ steps.meta.outputs.skipped }}
          META_DELETED: ${{ steps.meta.outputs.deleted }}
          META_DELETED_STILL: ${{ steps.meta.outputs.deleted_still }}
          META_DELETION_HELD: ${{ steps.meta.outputs.deletion_held }}
          META_RESTORED: ${{ steps.meta.outputs.restored }}
          META_GONE_UNRECORDED: ${{ steps.meta.outputs.gone_unrecorded }}
          META_UNLISTED: ${{ steps.meta.outputs.unlisted }}
          META_ERRORS: ${{ steps.meta.outputs.errors }}
          META_TOTAL: ${{ steps.meta.outputs.total }}
          META_DURATION: ${{ steps.meta.outputs.duration }}
          META_ERROR_RATE: ${{ steps.meta.outputs.error_rate }}
          CHANGES_CHANGED: ${{ steps.changes.outputs.changed }}
          PR_PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          {
            echo "## NTA Source DB Crawl Result"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| mode | ${MODE_MODE} |"
            echo "| job status | ${{ job.status }} |"
            echo "| fetched | ${META_FETCHED} |"
            echo "| skipped | ${META_SKIPPED} |"
            echo "| deleted | ${META_DELETED} |"
            echo "| deleted_still | ${META_DELETED_STILL} |"
            echo "| deletion_held | ${META_DELETION_HELD} |"
            echo "| restored | ${META_RESTORED} |"
            echo "| gone_unrecorded | ${META_GONE_UNRECORDED} |"
            echo "| unlisted | ${META_UNLISTED} |"
            echo "| errors | ${META_ERRORS} |"
            echo "| total processed | ${META_TOTAL} |"
            echo "| duration | ${META_DURATION}s |"
            echo "| error rate | ${META_ERROR_RATE}% |"
            echo "| changed | ${CHANGES_CHANGED} |"
            if [ "${CHANGES_CHANGED}" != "true" ]; then
              echo ""
              echo "■ 変更なし（時刻のみ更新のため PR は作成しません）"
            fi
            if [ -n "${PR_PR_URL}" ]; then
              echo "| PR | ${PR_PR_URL} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # 全件の報告（--report-full-file）があれば要約の後ろにつなぐ（G1）。
          if [ -f "${RUNNER_TEMP:-}/nta-crawl-report-full.md" ]; then
            {
              echo ""
              cat "$RUNNER_TEMP/nta-crawl-report-full.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
