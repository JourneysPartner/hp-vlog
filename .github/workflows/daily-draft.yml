name: Daily Blog Draft

run-name: >-
  Daily Blog Draft [source=${{ inputs.trigger_source || 'manual' }}][jst=${{ inputs.scheduled_date_jst || 'none' }}]

on:
  workflow_dispatch:
    inputs:
      high_quality:
        description: 'Opus 4.6 で高品質生成する場合は true'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      trigger_source:
        description: '起動元 (manual / scheduler-daily-draft)'
        required: false
        default: 'manual'
        type: string
      scheduled_date_jst:
        description: 'スケジューラが対象とする JST 日付 (YYYY-MM-DD)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Netlify スケジューラ経由 (trigger_source=scheduler-*) の場合、
      # 0〜50分のランダム待機を入れ、09:05〜09:55 JST の範囲でばらつかせる。
      # 手動実行 (trigger_source=manual) の場合は待機をスキップする。
      - name: Random delay (0-50 min)
        if: github.event.inputs.trigger_source != 'manual' && github.event.inputs.trigger_source != ''
        run: |
          DELAY=$(( RANDOM % 3001 ))   # 0〜3000秒 = 0〜50分
          echo "[delay] ${DELAY} 秒待機します（JST $(TZ=Asia/Tokyo date '+%H:%M:%S') 開始）"
          sleep "$DELAY"
          echo "[delay] 待機完了（JST $(TZ=Asia/Tokyo date '+%H:%M:%S')）"

      - name: Generate draft (2 articles)
        id: draft
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.high_quality }}" = "true" ]; then
            ARGS="--high-quality"
          fi
          node scripts/generate-draft.js $ARGS
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

      - name: Validate
        run: npm run validate

      - name: Build (smoke test)
        run: npm run build

      - name: Commit and push branch
        id: commit
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          BRANCH="draft/blog-${DATE}-${GITHUB_RUN_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/posts/

          if git diff --cached --quiet; then
            echo "新規ファイルなし。スキップします。"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(git diff --cached --name-only | wc -l)
          git commit -m "draft: ブログ下書き自動生成 ${DATE}（${COUNT}本）"
          git push origin "$BRANCH"

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.commit.outputs.skipped != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            ## 自動生成ドラフト（2本）

            GitHub Actions がブログ下書きを自動生成しました。
            Chatwork 通知のレビューURLから内容を確認してください。

            ### レビュー手順
            1. Chatwork 通知内のレビュー画面リンクを開く（記事ごとに1通）
            2. 記事の内容を確認する
               - タイトル・本文の妥当性
               - 出典URL（source_url）が実在するか
               - 免責事項の記載
            3. レビュー画面のボタンで操作する
               - **「このまま公開」** → 承認（公開日時を設定可能）
               - **「差し戻し」** → 修正コメントを記入して送信
               - **「今回は見送り」** → 記事を見送り

            > この下書きはAIが自動生成しています。内容の正確性は必ず確認してください。
        run: |
          printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
          if PR_URL=$(gh pr create \
            --title "【自動生成ドラフト】${{ steps.commit.outputs.date }}（2本）" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" 2>&1); then
            echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
            echo "pr_failed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pull Request を作成しました: ${PR_URL}"
          else
            echo "::error::Pull Request の作成に失敗しました: ${PR_URL}"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "pr_failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract frontmatter for notification
        if: steps.commit.outputs.skipped != 'true'
        id: fm
        run: |
          # 最新の2ファイルを取得（日付降順）
          FILES=$(ls -t content/posts/*.md | head -2)
          INDEX=0
          for FILE in $FILES; do
            INDEX=$((INDEX + 1))
            BASENAME=$(basename "$FILE")
            TITLE=$(grep '^title:' "$FILE" | head -1 | sed 's/^title: *"//;s/"$//')
            SUMMARY=$(grep '^summary:' "$FILE" | head -1 | sed 's/^summary: *"//;s/"$//')
            PERSONA=$(grep '^primary_persona:' "$FILE" | head -1 | sed 's/^primary_persona: *"//;s/"$//')
            CATEGORY=$(grep '^category:' "$FILE" | head -1 | sed 's/^category: *"//;s/"$//')
            SLUG=$(grep '^slug:' "$FILE" | head -1 | sed 's/^slug: *"//;s/"$//')
            ARTICLE_TYPE=$(grep '^article_type:' "$FILE" | head -1 | sed 's/^article_type: *"//;s/"$//')
            ARTICLE_ROLE=$(grep '^article_role:' "$FILE" | head -1 | sed 's/^article_role: *"//;s/"$//')

            echo "basename${INDEX}=${BASENAME}" >> "$GITHUB_OUTPUT"
            echo "title${INDEX}=${TITLE}" >> "$GITHUB_OUTPUT"
            echo "summary${INDEX}=${SUMMARY}" >> "$GITHUB_OUTPUT"
            echo "persona${INDEX}=${PERSONA}" >> "$GITHUB_OUTPUT"
            echo "category${INDEX}=${CATEGORY}" >> "$GITHUB_OUTPUT"
            echo "slug${INDEX}=${SLUG}" >> "$GITHUB_OUTPUT"
            echo "article_type${INDEX}=${ARTICLE_TYPE}" >> "$GITHUB_OUTPUT"
            echo "article_role${INDEX}=${ARTICLE_ROLE}" >> "$GITHUB_OUTPUT"
          done
          echo "count=${INDEX}" >> "$GITHUB_OUTPUT"

      # 記事ごとに個別通知（レビューURLが記事ごとに異なるため）
      - name: Notify article 1
        if: steps.commit.outputs.skipped != 'true' && steps.fm.outputs.basename1 != ''
        env:
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: |
          REVIEW_URL="https://mori-zeirishi.net/review?file=${{ steps.fm.outputs.basename1 }}&ref=${{ steps.commit.outputs.branch }}"

          PR_URL="${{ steps.pr.outputs.pr_url }}"
          if [ "${{ steps.pr.outputs.pr_failed }}" = "true" ]; then
            PR_URL="作成失敗（GitHub Actions のログを確認してください）"
          fi

          node scripts/notify.js \
            --event draft_created \
            --title "${{ steps.fm.outputs.title1 }}" \
            --summary "${{ steps.fm.outputs.summary1 }}" \
            --persona "${{ steps.fm.outputs.persona1 }}" \
            --category "${{ steps.fm.outputs.category1 }}" \
            --article-type "${{ steps.fm.outputs.article_type1 }}" \
            --article-role "${{ steps.fm.outputs.article_role1 }}" \
            --review-url "$REVIEW_URL" \
            --pr-url "$PR_URL"

      - name: Notify article 2
        if: steps.commit.outputs.skipped != 'true' && steps.fm.outputs.basename2 != ''
        env:
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: |
          REVIEW_URL="https://mori-zeirishi.net/review?file=${{ steps.fm.outputs.basename2 }}&ref=${{ steps.commit.outputs.branch }}"

          PR_URL="${{ steps.pr.outputs.pr_url }}"
          if [ "${{ steps.pr.outputs.pr_failed }}" = "true" ]; then
            PR_URL="作成失敗（GitHub Actions のログを確認してください）"
          fi

          node scripts/notify.js \
            --event draft_created \
            --title "${{ steps.fm.outputs.title2 }}" \
            --summary "${{ steps.fm.outputs.summary2 }}" \
            --persona "${{ steps.fm.outputs.persona2 }}" \
            --category "${{ steps.fm.outputs.category2 }}" \
            --article-type "${{ steps.fm.outputs.article_type2 }}" \
            --article-role "${{ steps.fm.outputs.article_role2 }}" \
            --review-url "$REVIEW_URL" \
            --pr-url "$PR_URL"
