name: Daily Blog Draft

run-name: >-
  Daily Blog Draft [source=${{ inputs.trigger_source || 'manual' }}][jst=${{ inputs.scheduled_date_jst || 'none' }}]

on:
  workflow_dispatch:
    inputs:
      high_quality:
        description: 'Opus 4.6 で高品質生成する場合は true'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      trigger_source:
        description: '起動元 (manual / scheduler-daily-draft)'
        required: false
        default: 'manual'
        type: string
      scheduled_date_jst:
        description: 'スケジューラが対象とする JST 日付 (YYYY-MM-DD)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

# 同一日に複数回 dispatch されても 1 つだけ走らせる（手動再実行と
# Netlify scheduler の二重起動による壊れを防ぐ最小限の保護）。
concurrency:
  group: daily-draft-${{ github.event.inputs.scheduled_date_jst || github.run_id }}
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # NOTE: 旧 "Random delay (0-50 min)" ステップは GitHub Actions minutes を
      # 大量消費（月 ≈ 625 分）するため削除した（2026-06-25）。
      # 投稿時刻のばらつきが将来必要なら、GitHub Actions の sleep ではなく
      # Netlify Functions 側（スケジューラ）または publish タイミングのアプリ側で
      # 再設計する前提とする。

      - name: Generate draft (2 articles)
        id: draft
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.high_quality }}" = "true" ]; then
            ARGS="--high-quality"
          fi
          node scripts/generate-draft.js $ARGS
        env:
          # 本文生成: Claude Sonnet 4.6（anthropic）。失敗時は OpenAI(gpt-5.4) に fallback。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_MODEL_PROVIDER: ${{ vars.CONTENT_MODEL_PROVIDER }}
          CONTENT_MODEL: ${{ vars.CONTENT_MODEL }}
          # prompt caching フラグ（Variables 推奨。Secret 側にしかない場合の後方互換で両参照）
          CONTENT_MODEL_USE_PROMPT_CACHE: ${{ vars.CONTENT_MODEL_USE_PROMPT_CACHE || secrets.CONTENT_MODEL_USE_PROMPT_CACHE }}
          # 周辺作業: Haiku 4.5 またはルールベース
          AUX_MODEL_ENABLED: ${{ vars.AUX_MODEL_ENABLED }}
          AUX_MODEL_PROVIDER: ${{ vars.AUX_MODEL_PROVIDER }}
          AUX_MODEL: ${{ vars.AUX_MODEL }}
          # OpenAI（fallback 用。必ず OPENAI_MODEL=gpt-5.4 を使う）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

      - name: Validate
        run: npm run validate

      - name: Build (smoke test)
        run: npm run build

      # ── 2本を別ブランチ・別PRに分離 ──────────────────────────────
      # generate-draft.js が出力した filename1/filename2 を使い、
      # 各記事を独立したブランチに commit → 個別 PR を作成する。
      # これにより片方だけ skip / revise / approve が可能になる。

      - name: Prepare articles for separate PRs
        id: prep
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # generate-draft.js の出力から取得
          FILE1="${{ steps.draft.outputs.filename1 }}"
          FILE2="${{ steps.draft.outputs.filename2 }}"
          COUNT="${{ steps.draft.outputs.count }}"

          if [ -z "$FILE1" ]; then
            echo "新規ファイルなし。スキップします。"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "count=${COUNT:-1}" >> "$GITHUB_OUTPUT"

          # 記事ファイルを /tmp に退避
          cp "content/posts/$FILE1" /tmp/article1.md
          if [ -n "$FILE2" ]; then
            cp "content/posts/$FILE2" /tmp/article2.md
          fi

          # 各記事のメタデータ抽出
          for IDX in 1 2; do
            TMPFILE="/tmp/article${IDX}.md"
            [ -f "$TMPFILE" ] || continue

            BASENAME=$(eval echo "\$FILE${IDX}")
            TITLE=$(grep '^title:' "$TMPFILE" | head -1 | sed 's/^title: *"//;s/"$//')
            SUMMARY=$(grep '^summary:' "$TMPFILE" | head -1 | sed 's/^summary: *"//;s/"$//')
            PERSONA=$(grep '^primary_persona:' "$TMPFILE" | head -1 | sed 's/^primary_persona: *"//;s/"$//')
            CATEGORY=$(grep '^category:' "$TMPFILE" | head -1 | sed 's/^category: *"//;s/"$//')
            SLUG=$(grep '^slug:' "$TMPFILE" | head -1 | sed 's/^slug: *"//;s/"$//')
            ARTICLE_TYPE=$(grep '^article_type:' "$TMPFILE" | head -1 | sed 's/^article_type: *"//;s/"$//')
            ARTICLE_ROLE=$(grep '^article_role:' "$TMPFILE" | head -1 | sed 's/^article_role: *"//;s/"$//')

            echo "basename${IDX}=${BASENAME}" >> "$GITHUB_OUTPUT"
            echo "title${IDX}=${TITLE}" >> "$GITHUB_OUTPUT"
            echo "summary${IDX}=${SUMMARY}" >> "$GITHUB_OUTPUT"
            echo "persona${IDX}=${PERSONA}" >> "$GITHUB_OUTPUT"
            echo "category${IDX}=${CATEGORY}" >> "$GITHUB_OUTPUT"
            echo "slug${IDX}=${SLUG}" >> "$GITHUB_OUTPUT"
            echo "article_type${IDX}=${ARTICLE_TYPE}" >> "$GITHUB_OUTPUT"
            echo "article_role${IDX}=${ARTICLE_ROLE}" >> "$GITHUB_OUTPUT"
          done

          # 生成ファイルを作業ツリーから削除（各ブランチで個別に追加するため）
          rm -f "content/posts/$FILE1"
          if [ -n "$FILE2" ]; then rm -f "content/posts/$FILE2"; fi

      # ── 記事1: 専用ブランチ → 専用PR ──────────────────────────
      - name: Create branch & PR for article 1
        if: steps.prep.outputs.skipped != 'true'
        id: pr1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.prep.outputs.date }}"
          SLUG="${{ steps.prep.outputs.slug1 }}"
          BASENAME="${{ steps.prep.outputs.basename1 }}"
          TITLE="${{ steps.prep.outputs.title1 }}"
          ROLE="${{ steps.prep.outputs.article_role1 }}"

          BRANCH="draft/${DATE}-${SLUG}"

          git checkout -b "$BRANCH"
          cp /tmp/article1.md "content/posts/${BASENAME}"
          git add "content/posts/${BASENAME}"
          git commit -m "draft: ${TITLE}"
          git push origin "$BRANCH"

          ROLE_LABEL="補強記事"
          if [ "$ROLE" = "main" ]; then ROLE_LABEL="本命記事"; fi

          PAIR_INFO=""
          if [ -n "${{ steps.prep.outputs.title2 }}" ]; then
            PAIR_INFO="■ ペア記事: ${{ steps.prep.outputs.title2 }}"
          fi

          PR_BODY=$(cat <<PREOF
          ## 自動生成ドラフト（${ROLE_LABEL}）

          | 項目 | 内容 |
          |---|---|
          | 記事タイプ | ${{ steps.prep.outputs.article_type1 }} |
          | 記事の役割 | ${ROLE_LABEL} |
          ${PAIR_INFO:+| ペア記事 | ${{ steps.prep.outputs.title2 }} |}

          ### レビュー手順
          1. Chatwork 通知内のレビュー画面リンクを開く
          2. 記事の内容を確認する
          3. レビュー画面のボタンで操作する
             - **「このまま公開」** → 承認
             - **「差し戻し」** → 修正コメントを記入して送信
             - **「今回は見送り」** → 記事を見送り

          > この下書きはAIが自動生成しています。内容の正確性は必ず確認してください。
          > **この記事は独立してレビュー・承認できます。** ペア記事の操作には影響しません。
          PREOF
          )

          if PR_URL=$(gh pr create \
            --title "【${ROLE_LABEL}】${TITLE}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" 2>&1); then
            echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
            echo "::notice::PR を作成しました: ${PR_URL}"
          else
            echo "::error::PR の作成に失敗しました: ${PR_URL}"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # 次の記事のためにメインブランチに戻る
          git checkout main

      # ── 記事2: 専用ブランチ → 専用PR ──────────────────────────
      - name: Create branch & PR for article 2
        if: steps.prep.outputs.skipped != 'true' && steps.prep.outputs.basename2 != ''
        id: pr2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.prep.outputs.date }}"
          SLUG="${{ steps.prep.outputs.slug2 }}"
          BASENAME="${{ steps.prep.outputs.basename2 }}"
          TITLE="${{ steps.prep.outputs.title2 }}"
          ROLE="${{ steps.prep.outputs.article_role2 }}"

          BRANCH="draft/${DATE}-${SLUG}"

          git checkout -b "$BRANCH"
          cp /tmp/article2.md "content/posts/${BASENAME}"
          git add "content/posts/${BASENAME}"
          git commit -m "draft: ${TITLE}"
          git push origin "$BRANCH"

          ROLE_LABEL="補強記事"
          if [ "$ROLE" = "main" ]; then ROLE_LABEL="本命記事"; fi

          PR_BODY=$(cat <<PREOF
          ## 自動生成ドラフト（${ROLE_LABEL}）

          | 項目 | 内容 |
          |---|---|
          | 記事タイプ | ${{ steps.prep.outputs.article_type2 }} |
          | 記事の役割 | ${ROLE_LABEL} |
          ${PAIR_INFO:+| ペア記事 | ${{ steps.prep.outputs.title1 }} |}

          ### レビュー手順
          1. Chatwork 通知内のレビュー画面リンクを開く
          2. 記事の内容を確認する
          3. レビュー画面のボタンで操作する
             - **「このまま公開」** → 承認
             - **「差し戻し」** → 修正コメントを記入して送信
             - **「今回は見送り」** → 記事を見送り

          > この下書きはAIが自動生成しています。内容の正確性は必ず確認してください。
          > **この記事は独立してレビュー・承認できます。** ペア記事の操作には影響しません。
          PREOF
          )

          if PR_URL=$(gh pr create \
            --title "【${ROLE_LABEL}】${TITLE}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" 2>&1); then
            echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
            echo "::notice::PR を作成しました: ${PR_URL}"
          else
            echo "::error::PR の作成に失敗しました: ${PR_URL}"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ── 通知（記事ごとに個別送信）──────────────────────────────
      - name: Notify article 1
        if: steps.prep.outputs.skipped != 'true'
        env:
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: |
          REVIEW_URL="https://mori-zeirishi.net/review?file=${{ steps.prep.outputs.basename1 }}&ref=${{ steps.pr1.outputs.branch }}"

          PR_URL="${{ steps.pr1.outputs.pr_url }}"
          [ -z "$PR_URL" ] && PR_URL="作成失敗（GitHub Actions のログを確認してください）"

          node scripts/notify.js \
            --event draft_created \
            --title "${{ steps.prep.outputs.title1 }}" \
            --summary "${{ steps.prep.outputs.summary1 }}" \
            --persona "${{ steps.prep.outputs.persona1 }}" \
            --category "${{ steps.prep.outputs.category1 }}" \
            --article-type "${{ steps.prep.outputs.article_type1 }}" \
            --article-role "${{ steps.prep.outputs.article_role1 }}" \
            --review-url "$REVIEW_URL" \
            --pr-url "$PR_URL"

      - name: Notify article 2
        if: steps.prep.outputs.skipped != 'true' && steps.prep.outputs.basename2 != ''
        env:
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: |
          REVIEW_URL="https://mori-zeirishi.net/review?file=${{ steps.prep.outputs.basename2 }}&ref=${{ steps.pr2.outputs.branch }}"

          PR_URL="${{ steps.pr2.outputs.pr_url }}"
          [ -z "$PR_URL" ] && PR_URL="作成失敗（GitHub Actions のログを確認してください）"

          node scripts/notify.js \
            --event draft_created \
            --title "${{ steps.prep.outputs.title2 }}" \
            --summary "${{ steps.prep.outputs.summary2 }}" \
            --persona "${{ steps.prep.outputs.persona2 }}" \
            --category "${{ steps.prep.outputs.category2 }}" \
            --article-type "${{ steps.prep.outputs.article_type2 }}" \
            --article-role "${{ steps.prep.outputs.article_role2 }}" \
            --review-url "$REVIEW_URL" \
            --pr-url "$PR_URL"
