name: Check Tax Simulator Masters

# 税シミュレータのマスターデータが、現在の法令・料率に追いついているかを確認する。
#
#   - 出典（タックスアンサー）の html_hash がマスターの source_hash と食い違えば、
#     出典が更新されたということ。マスターの見直しが要る
#   - 年度で揃えるマスター（給与所得控除・社会保険料率など）に対象期間のレコードが無ければ、
#     新年度分が未登録ということ
#   - 告示の時期（社会保険は3月、税制は12月）には、切替前に「次の期間がまだ無い」と予告する
#
# 値の自動更新はしない。crawl-nta-sources / check-tax-reform と同じ方針で、
# 検知と scripts/notify.js → Netlify 経由の通知までを自動化する。
# 金額の入力と二者確認は人が行う（仕様書 §50-1）。
#
# 実行順序の意図:
#   1日  crawl-nta-sources    国税庁ソースDBを更新（hash が動く）
#   5日  check-tax-reform     財務省の大綱を確認
#   8日  このワークフロー       更新後の hash でマスターを突き合わせる
on:
  schedule:
    - cron: '0 16 8 * *'   # 毎月 8 日 JST 01:00（UTC 16:00）
  workflow_dispatch:
    inputs:
      as_of:
        description: '基準日（YYYY-MM-DD。省略時は当日）。告示前の予告動作を試すのにも使う'
        required: false
        type: string
  pull_request:
    paths:
      - 'data/tax-simulator/masters/**'
      - 'data/tax-simulator/schemas/input/**'
      - 'scripts/generate-input-types.js'
      - 'scripts/lib/input-types/**'
      - 'scripts/lib/__tests__/**'
      - 'package.json'
      - 'scripts/check-master-freshness.js'
      - 'scripts/run-test-files.js'
      - 'scripts/validate-masters.js'
      - 'scripts/approve-records.js'
      - 'scripts/fetch-kenpo-rates.js'
      - 'scripts/verify-source-urls.js'
      - 'scripts/lib/**'
      - 'scripts/update-gsc-topics.js'
      - 'scripts/notify.js'
      - 'netlify/functions/lib/notify/**'
      - 'data/gsc-topics.json'
      - 'data/query-synonyms.json'
      - 'docs/codex-tasks/weekly-signal-fixes/*.json'
      - '.github/workflows/check-tax-simulator-masters.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 入力型の生成差分を検査
        run: npm run input-types:check

      # 形式が壊れていたら止める。ここは要確認の有無と関係なく落ちてよい。
      - name: Validate master data
        id: validate
        if: ${{ !cancelled() }}
        run: node scripts/validate-masters.js

      # masters:test に記事の統合・内部リンク・索引状態のテストが加わり、gray-matter と marked（ビルド）を使う
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run master tests
        run: npm run masters:test

      - name: Check master freshness
        id: check
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        continue-on-error: true   # 要確認があっても通知まで進める
        env:
          INPUT_AS_OF: ${{ github.event.inputs.as_of }}
          MASTERS_DIR: data/tax-simulator/masters
          NTA_SOURCES_DIR: data/nta-sources
        run: |
          AS_OF="${INPUT_AS_OF}"
          if [ -n "$AS_OF" ] && [[ ! "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::as_of は空、または YYYY-MM-DD で指定してください。"
            exit 1
          fi
          if [ -n "$AS_OF" ]; then
            node scripts/check-master-freshness.js --as-of "$AS_OF"
          else
            node scripts/check-master-freshness.js
          fi

      - name: Comment on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.check.outputs.needs_attention != '' }}
        env:
          CHECK_REPORT: ${{ steps.check.outputs.report }}
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## マスターデータ鮮度チェック'
            echo
            echo '```'
            echo "${CHECK_REPORT}"
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${PR_NUMBER}" --body-file /tmp/comment.md

      - name: Notify
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.check.outputs.needs_attention != '' && steps.check.outputs.needs_attention != '0' }}
        env:
          INPUT_AS_OF: ${{ github.event.inputs.as_of }}
          NETLIFY_NOTIFY_URL: ${{ vars.NETLIFY_NOTIFY_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
          NOTIFY_SUMMARY: ${{ steps.check.outputs.notify_summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$INPUT_AS_OF" ]; then
            echo "::notice::基準日を指定した試行のため通知しません（基準日 ${INPUT_AS_OF}）"
            exit 0
          fi
          if [ -z "$NETLIFY_NOTIFY_URL" ]; then
            echo "::warning::通知先（vars.NETLIFY_NOTIFY_URL）が未設定のため通知できません"
            exit 0
          fi
          NOTIFY_OUTPUT=$(node scripts/notify.js --event master_freshness --title "税シミュレーターのマスター鮮度チェック" --summary "$NOTIFY_SUMMARY" --pr-url "$RUN_URL" 2>&1) || true
          printf '%s\n' "$NOTIFY_OUTPUT"
          if [[ "$NOTIFY_OUTPUT" != *"[notify] 送信完了"* ]]; then
            echo "::warning::通知の送信を確認できませんでした（上のログを確認）"
          fi
          exit 0

      - name: Emit job summary
        if: always()
        env:
          CHECK_HASH_MISMATCH: ${{ steps.check.outputs.hash_mismatch }}
          CHECK_COVERAGE_GAP: ${{ steps.check.outputs.coverage_gap }}
          CHECK_COVERAGE_UPCOMING: ${{ steps.check.outputs.coverage_upcoming }}
          CHECK_BLOCKED: ${{ steps.check.outputs.blocked }}
          CHECK_NOT_APPROVED: ${{ steps.check.outputs.not_approved }}
          CHECK_REPORT: ${{ steps.check.outputs.report }}
        run: |
          {
            echo "## Tax Simulator Masters"
            echo ""
            echo "| 項目 | 件数 |"
            echo "|---|---|"
            echo "| 出典が更新された | ${CHECK_HASH_MISMATCH} |"
            echo "| 対象期間のレコード無し | ${CHECK_COVERAGE_GAP} |"
            echo "| 次の期間が未登録（予告） | ${CHECK_COVERAGE_UPCOMING} |"
            echo "| 確認待ち(blocked) | ${CHECK_BLOCKED} |"
            echo "| 未承認 | ${CHECK_NOT_APPROVED} |"
            echo ""
            echo '```'
            echo "${CHECK_REPORT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if sources are unreachable
        if: ${{ !cancelled() && steps.check.outcome == 'failure' }}
        run: |
          echo "::error::出典が取得できていません。台帳の URL か crawl の状態を確認してください。"
          exit 1
